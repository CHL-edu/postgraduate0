[simulation]
# 仿真基本参数（时隙模式）- 优化后参数用于算法性能差异化测试
lambda_rate = 63.0
# 每个时隙的平均请求到达数量（泊松分布参数）- 增加负载
simulation_duration = 3000.0
# 仿真总时隙数（时隙模式下表示时隙数量）- 增加统计显著性
time_step = 0.1
# 保留用于兼容性（时隙模式下不使用）
num_spectrum_slots = 60
default_capacity = 600.0

[logging]
# 数据记录配置
enable_logging = true
log_directory = E:\PythonProject\KSP\log
timeslot_duration = 1.0

# 记录选项
log_request_decisions = true
log_spectrum_matrix = true
log_performance_metrics = true
log_network_state = true

# 数据记录默认参数
default_spectrum_slots_for_empty_files = 320

[algorithms]
# 算法配置
ksp_k_value = 3
random_fit_k_value = 5
# Random Fit算法最大路径数量
random_fit_max_paths = 10
# 路径权重默认值default_path_weight = 1

[network]
# 网络拓扑配置 (NSFNet)
# 节点数量: 14
# 边数量: 21
# 拓扑类型: NSFNet

[output]
# 输出配置
backup_directory = E:\PythonProject\KSP\log
enable_visualization = true
save_plots = true
plot_dpi = 300

[visualization]
# 可视化参数配置
figure_width = 12
figure_height = 10
spring_layout_k = 0.3
spring_layout_iterations = 50
node_size = 800
node_color = lightblue
node_alpha = 0.9
edge_width = 1.5
edge_color = gray
edge_alpha = 0.7
font_size = 12
title_font_size = 15

[performance]
# 性能监控配置
progress_interval = 10
memory_optimization = false
async_logging = false

[time_management]
# 时间管理参数
default_time_step = 0.1
default_timeslot_duration = 1.0

[algorithm_weights]
# 算法权重参数
# FA-CA算法权重
fa_ca_spectrum_weight = 0.4
fa_ca_load_weight = 0.3
fa_ca_fragmentation_weight = 0.3

# KSP-LB算法权重
ksp_lb_std_weight = 0.7
ksp_lb_mean_weight = 0.3

# KSP-FA算法权重
ksp_fa_block_count_weight = 0.7
ksp_fa_size_uniformity_weight = 0.3

# 其他算法参数
edge_weight_offset = 0.01
fragmentation_low_utilization_threshold = 0.1
fragmentation_low_utilization_factor = 0.5


[request_generation]
# 请求生成参数（时隙模式）- 优化后参数用于算法性能差异化测试
small_bandwidth_probability = 1.0
small_bandwidth_min = 20.0
small_bandwidth_max = 50.0
large_bandwidth_min = 80.0
large_bandwidth_max = 120.0
spectrum_slot_bandwidth = 10
#12.5
duration_mean = 4.0
# 请求持续时隙数的平均值（指数分布参数）- 增加持续时间


[test_parameters]
# 测试参数（纯时隙模式）
test_num_spectrum_slots = 100

[timeslot_mode]
# 时隙模式专用配置 - 优化后参数用于算法性能差异化测试
total_timeslots = 3000
# 仿真总时隙数 - 增加统计显著性
requests_per_timeslot = 63.0
# 每个时隙的平均请求数量（泊松分布参数）- 增加网络负载
duration_timeslots_mean = 4.0
# 请求持续时隙数的平均值（指数分布参数）- 增加持续时间
random_seed = 42
# 固定随机种子确保结果可重现

[parameter_change]
# 参数动态变化控制
test_changePara = True
# 是否启用参数动态变化功能


# 变化模式配置

change_mode = triangle_wave
# 变化模式: sine_wave(正弦波), triangle_wave(三角波), step_change(阶跃), linear_trend(线性趋势)
change_period = 50
# 变化周期（时隙数）
change_amplitude = 0.3
# 变化幅度（相对于基础值的比例，0.3表示±30%）


# request_generation参数变化开关
change_small_bandwidth_probability = False
# 是否变化小带宽请求概率
change_duration_mean = False
# 是否变化请求持续时间均值
change_bandwidth_ranges = False
# 是否变化带宽范围
change_requests_per_timeslot = True
# 是否变化每时隙请求数量（Lambda参数）

# test_parameters参数变化开关
change_spectrum_slots = False
# 是否变化频谱槽数量

# 高级变化配置
phase_offset = 0.0
# 相位偏移（弧度）
min_value_ratio = 0.5
# 最小值比例（防止参数变为负数或过小）
max_value_ratio = 2.0
# 最大值比例（防止参数过大）

# 参数变化范围限制
bandwidth_probability_min = 0.1
bandwidth_probability_max = 0.9
requests_per_timeslot_min = 1.0
requests_per_timeslot_max = 50.0
spectrum_slots_min = 50
spectrum_slots_max = 200
#
#        # 设置计算开销记录（可选）
        # nsfnet.set_computational_overhead_tracking(False)  # 禁用以提高性能
        #nsfnet.set_computational_overhead_tracking(False)   # 启用详细分析