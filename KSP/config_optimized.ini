# NSFNet仿真项目优化配置文件
# 重新组织的层次化配置结构，提供更好的参数集中管理
# 迁移时间: 2025-07-31 15:33:20

[defaults]
spectrum_slots = 80
capacity = 800.0
time_step = 0.1
timeslot_duration = 1.0
random_seed = 42
k_value = 3
weight = 1
probability = 1.0
bandwidth_unit = 10

[network]
topology_type = NSFNet
num_nodes = 14
num_edges = 21
default_capacity = ${defaults:capacity}
num_spectrum_slots = ${defaults:spectrum_slots}

[simulation]
mode = timeslot
total_timeslots = 1000
time_step = ${defaults:time_step}
timeslot_duration = ${defaults:timeslot_duration}
random_seed = ${defaults:random_seed}
lambda_rate = 35.0
simulation_duration = 1000.0

[traffic]
requests_per_timeslot = 35.0
small_bandwidth_probability = 1.0
small_bandwidth_min = 15.0
small_bandwidth_max = 35.0
large_bandwidth_min = 80.0
large_bandwidth_max = 120.0
spectrum_slot_bandwidth = ${defaults:bandwidth_unit}
duration_mean = 3.0
duration_timeslots_mean = 3.0

[algorithms]
ksp_k_value = ${defaults:k_value}
random_fit_k_value = 5
random_fit_max_paths = 10
default_path_weight = ${defaults:weight}
fa_ca.spectrum_weight = 0.4
fa_ca.load_weight = 0.3
fa_ca.fragmentation_weight = 0.3
ksp_lb.std_weight = 0.7
ksp_lb.mean_weight = 0.3
ksp_fa.block_count_weight = 0.7
ksp_fa.size_uniformity_weight = 0.3
edge_weight_offset = 0.01
fragmentation_low_utilization_threshold = 0.1
fragmentation_low_utilization_factor = 0.5

[logging]
enable_logging = true
log_directory = E:\PythonProject\KSP\log
backup_directory = E:\PythonProject\KSP\log
log_request_decisions = true
log_spectrum_matrix = true
log_performance_metrics = true
log_network_state = true
default_spectrum_slots_for_empty_files = 320

[visualization]
enable_visualization = true
save_plots = true
plot_dpi = 300
figure_width = 12
figure_height = 10
spring_layout_k = 0.3
spring_layout_iterations = 50
node_size = 800
node_color = lightblue
node_alpha = 0.9
edge_width = 1.5
edge_color = gray
edge_alpha = 0.7
font_size = 12
title_font_size = 15

[performance]
progress_interval = 10
memory_optimization = false
async_logging = false

[dynamics]
enable_parameter_change = False
change_mode = triangle_wave
change_period = 50
change_amplitude = 0.3
change_small_bandwidth_probability = False
change_duration_mean = False
change_bandwidth_ranges = False
change_requests_per_timeslot = True
change_spectrum_slots = False
phase_offset = 0.0
min_value_ratio = 0.5
max_value_ratio = 2.0
bandwidth_probability_min = 0.1
bandwidth_probability_max = 0.9
requests_per_timeslot_min = 1.0
requests_per_timeslot_max = 50.0
spectrum_slots_min = 50
spectrum_slots_max = 200

[test_parameters]
test_num_spectrum_slots = 100

[time_management]
default_time_step = 0.1
default_timeslot_duration = 1.0

